# GPU batch profiling only. This file is not an OOF training configuration.
__include__:
  - ../../third_party/D-FINE/configs/dfine/dfine_hgnetv2_n_coco.yml
num_classes: 1
remap_mscoco_category: true
seed: 20260724
train_dataloader:
  total_batch_size: 8
  dataset:
    img_folder: artifacts/box_system/staged/images
    ann_file: artifacts/box_system/interrupted-runs/dfine_n_640-seed20260724-fold0-oversized-batch-20260727T0828/fold-data/train.json
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [768, 768]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: 72
        ops: ['RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
  collate_fn:
    base_size: 768
val_dataloader:
  total_batch_size: 8
  dataset:
    img_folder: artifacts/box_system/staged/images
    ann_file: artifacts/box_system/interrupted-runs/dfine_n_640-seed20260724-fold0-oversized-batch-20260727T0828/fold-data/validation.json
    transforms:
      ops:
        - {type: Resize, size: [768, 768]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
