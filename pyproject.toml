[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "bixolon-bakery-scanner"
version = "0.1.0"
description = "Detector and verifier pipeline for bakery scanner boxes"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=2.4,<2.5",
  "Pillow==12.2.0",
  "opencv-python>=5.0,<5.1",
  "scipy>=1.17,<1.18",
  "scikit-learn>=1.9,<2",
  "PyYAML>=6.0,<7",
  "pydantic>=2.13,<3",
]

[project.optional-dependencies]
verifier = ["torch>=2.8,<2.9", "torchvision>=0.23,<0.24", "timm==1.0.28"]
runtime = ["openvino==2026.2.1"]
dev = ["pytest>=9.1,<10", "pytest-cov>=7.1,<8"]

[project.scripts]
bakery-boxes = "bakery_scanner.cli:main"
bakery-artifacts = "bakery_scanner.artifacts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not artifact and not gpu and not slow'"
markers = [
  "artifact: requires local datasets, model weights, prototype banks, or packaged runtimes",
  "contract: immutable pipeline, output, integrity, and repository policy contracts",
  "gpu: requires the declared CUDA device and GPU runtime",
  "integration: crosses component, subprocess, application, or packaging boundaries",
  "slow: intentionally long-running benchmark, dataset, or packaging verification",
  "unit: hermetic first-party unit test",
]
